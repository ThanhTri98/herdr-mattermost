id = "herdr-mattermost"
name = "Mattermost"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Mirror agent panes into Mattermost channels and type @mentions of the bot into the agent"
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "./build.sh"]

[[startup]]
id = "daemon"
command = ["sh", "-c", "exec ./herdr-mm start"]

[[panes]]
id = "status"
title = "Mattermost status"
description = "The daemon and the agent panes, to toggle Mattermost mirroring"
placement = "popup"
width = "90%"
command = ["sh", "-c", "exec ./herdr-mm status"]

[[actions]]
id = "status"
title = "Show Mattermost status"
description = "Open a popup listing the agent panes, to toggle their mirroring and pick their channel, and whether the daemon runs"
contexts = ["global", "workspace", "pane"]
# herdr's popup is a singleton, so opening it twice is not an error
command = ["sh", "-c", "h=herdr; [ -f \"$HERDR_BIN_PATH\" ] && [ -x \"$HERDR_BIN_PATH\" ] && h=$HERDR_BIN_PATH; out=$(\"$h\" plugin pane open --plugin herdr-mattermost --entrypoint status 2>&1) || case $out in *'already open'*) ;; *) echo \"$out\" >&2; exit 1 ;; esac"]

[[actions]]
id = "toggle"
title = "Toggle Mattermost mirroring"
description = "Start or stop mirroring this pane's agent into Mattermost"
contexts = ["pane"]
command = ["sh", "-c", "exec ./herdr-mm toggle"]

[[actions]]
id = "stop"
title = "Stop Mattermost daemon"
description = "Stop the daemon that types Mattermost messages into agents"
contexts = ["global", "workspace", "pane"]
command = ["sh", "-c", "exec ./herdr-mm stop"]

[[events]]
on = "pane.agent_status_changed"
command = ["sh", "-c", "exec ./herdr-mm event"]

[[events]]
on = "pane.moved"
command = ["sh", "-c", "exec ./herdr-mm event"]

[[events]]
on = "pane.closed"
command = ["sh", "-c", "exec ./herdr-mm event"]
